        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    container_name: kozker_frontend
    environment:
      - BACKEND_URL=http://backend:8000
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: always
    depends_on:
